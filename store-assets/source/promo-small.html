<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slop Detector — small promo</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 440px; height: 280px; margin: 0; overflow: hidden; }
  body {
    border: 6px solid #23241F; background: #F6F4EE; color: #23241F;
    padding: 47px 31px 30px; font-family: "Courier New", monospace;
  }
  header { display: flex; align-items: center; gap: 17px; margin-bottom: 24px; }
  img { width: 46px; height: 50px; object-fit: contain; }
  h1 { margin: 0; font-size: 32px; line-height: 1; letter-spacing: .12em; white-space: nowrap; }
  p { margin: 0; font-size: 18px; line-height: 1.45; white-space: nowrap; }
  .mark {
    text-decoration: underline wavy #C42B1F 1.5px;
    text-underline-offset: 3px;
  }
  .stamp {
    width: max-content; margin: 23px auto 0; padding: 9px 14px 7px;
    border: 3px double #C42B1F; color: #C42B1F; transform: rotate(-4deg);
    font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: .08em;
  }
</style>
</head>
<body>
  <header><img src="../icon-master.png" alt=""><h1>SLOP DETECTOR</h1></header>
  <p>a <span class="mark">rich tapestry</span> of <span class="mark">pivotal</span> insights</p>
  <div class="stamp">CERTIFIED SLOP</div>
</body>
</html>
